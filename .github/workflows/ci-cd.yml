name: CI/CD

# CI : GitHub Actions vérifie le code (lint, tests, build) à chaque push et Pull Request.
# CD : Vercel (relié au dépôt GitHub) déploie automatiquement chaque push sur main
#      en production, et chaque Pull Request sur une URL de prévisualisation.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, tests et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build